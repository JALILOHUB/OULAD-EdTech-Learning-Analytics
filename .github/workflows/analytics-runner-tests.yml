name: Analytics runner tests

on:
  push:
    branches:
      - work/wo2-pre-execution-readiness
    paths:
      - "src/analytics/db.py"
      - "tests/**"
      - ".github/workflows/analytics-runner-tests.yml"
      - "requirements.txt"
  pull_request:
    branches:
      - work/wo2-execution-foundation
    paths:
      - "src/analytics/db.py"
      - "tests/**"
      - ".github/workflows/analytics-runner-tests.yml"
      - "requirements.txt"

jobs:
  runner-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: oulad_runner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oulad_runner_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: oulad_runner_test
      DB_USER: postgres
      DB_PASSWORD: test-password
      OULAD_TEST_DATABASE_URL: postgresql://postgres:test-password@localhost:5432/oulad_runner_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install runner dependencies
        run: python -m pip install "pandas==3.0.6" "psycopg[binary]==3.3.6" "python-dotenv==1.2.4"
      - name: Run synthetic unit and isolated PostgreSQL integration tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
